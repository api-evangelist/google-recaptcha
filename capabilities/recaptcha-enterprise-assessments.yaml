naftiko: 1.0.0-alpha2
info:
  label: Google reCAPTCHA reCAPTCHA Enterprise API — Assessments
  description: 'Google reCAPTCHA reCAPTCHA Enterprise API — Assessments. 2 operations. Lead operation: Google reCAPTCHA Create
    assessment. Self-contained Naftiko capability covering one Google Recaptcha business surface.'
  tags:
  - Google Recaptcha
  - Assessments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_RECAPTCHA_API_KEY: GOOGLE_RECAPTCHA_API_KEY
capability:
  consumes:
  - type: http
    namespace: recaptcha-enterprise-assessments
    baseUri: https://recaptchaenterprise.googleapis.com/v1
    description: Google reCAPTCHA reCAPTCHA Enterprise API — Assessments business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectId-assessments
      path: /projects/{projectId}/assessments
      operations:
      - name: createassessment
        method: POST
        description: Google reCAPTCHA Create assessment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: projects-projectId-assessments-assessmentId}:annotate
      path: /projects/{projectId}/assessments/{assessmentId}:annotate
      operations:
      - name: annotateassessment
        method: POST
        description: Google reCAPTCHA Annotate assessment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assessmentId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_RECAPTCHA_API_KEY}}'
  exposes:
  - type: rest
    namespace: recaptcha-enterprise-assessments-rest
    port: 8080
    description: REST adapter for Google reCAPTCHA reCAPTCHA Enterprise API — Assessments. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/projects/{projectid}/assessments
      name: projects-projectid-assessments
      description: REST surface for projects-projectId-assessments.
      operations:
      - method: POST
        name: createassessment
        description: Google reCAPTCHA Create assessment
        call: recaptcha-enterprise-assessments.createassessment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectid}/assessments/assessmentid-annotate
      name: projects-projectid-assessments-assessmentid-annotate
      description: REST surface for projects-projectId-assessments-assessmentId}:annotate.
      operations:
      - method: POST
        name: annotateassessment
        description: Google reCAPTCHA Annotate assessment
        call: recaptcha-enterprise-assessments.annotateassessment
        with:
          assessmentId: rest.assessmentId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: recaptcha-enterprise-assessments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google reCAPTCHA reCAPTCHA Enterprise API — Assessments. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: google-recaptcha-create-assessment
      description: Google reCAPTCHA Create assessment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: recaptcha-enterprise-assessments.createassessment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-recaptcha-annotate-assessment
      description: Google reCAPTCHA Annotate assessment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: recaptcha-enterprise-assessments.annotateassessment
      with:
        assessmentId: tools.assessmentId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
