apis:
- name: reCAPTCHA Site Verify API
  description: >-
    The reCAPTCHA Site Verify API is the standard verification endpoint for reCAPTCHA v2 and v3 tokens.
    After a user completes a reCAPTCHA challenge on the frontend, the backend sends the response token
    to this API to verify the interaction. The API returns whether the verification succeeded, a score
    (for v3), the action name, and the hostname.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.google.com/recaptcha/docs/verify
  baseURL: https://www.google.com/recaptcha/api
  tags:
  - reCAPTCHA V3
  - Token Validation
  - Verification
  properties:
  - type: Documentation
    url: https://developers.google.com/recaptcha/docs/verify
